<article class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow-md">
  <h2 class="mb-2 font-semibold wrap-break-word text-slate-800">{{ note().title }}</h2>
  <p class="whitespace-pre-line wrap-break-word text-slate-700">{{ note().text }}</p>

  <div class="mt-3 flex justify-end">
    <button
      type="button"
      [attr.aria-label]="'Ištrinti užrašą ' + note().title"
      (click)="removed.emit()"
      class="rounded-lg px-3 py-1 text-sm text-slate-500 hover:bg-red-50 hover:text-red-600"
    >
      Ištrinti
    </button>
  </div>
</article>
